- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: vnmurthy.online
    input: create
  tasks: # To interact with aws, ansible requires these python packages
  - name: install python packages
    pip:
      name: "{{ item }}"
      state: present
    loop:
    - boto3
    - botocore
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t2.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups:
      - "roboshop-{{ item }}"
      - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output
    when: input == "create"
  # - name: print ec2_output
  #   debug:
  #     msg: "{{ ec2_output }}"
  # - name: create route53 record
  #   debug:
  #     msg: "Instance Name: {{ item.item }} PrivateIP: {{ item.instances[0].private_ip_address }}"
        # Instance name is present in item variable in the ec2_output
  #   loop: "{{ ec2_output.results }}" # We will use item because the loop will execute on results
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongodb.vnmurthy.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: input == "create"

  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}" 
    # when: item.item == "frontend"
    when: 
    - item.item == "frontend"
    - input == "create"

  - name: delete r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when: input == "delete"

  - name: delete r53 record for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when:
    - input == "delete"
    - item == "frontend"

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
    loop: "{{ instances }}"
    when: input == "delete"

# you need to configure your cli with your aws credentials 
# aws configure
# aws_access_key:
# aws_secret_access_key: 

# commands:

# ansible-playbook -i inventory.ini -e “instances=[‘frontend’]” roboshop.yaml → To pass an arugument via command line. 
# ansible-playbook -i inventory.ini -e “input=delete” roboshop.yaml → To pass the input from command line 
# ansible-playbook -i inventory.ini -e “input=delete” -e “instances=[‘mongodb’, ‘mysql’, ‘redis’, ‘rabbitmq’]” --> To delete particular instances

