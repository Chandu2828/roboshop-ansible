- name: configuring catalogue server
  hosts: catalogue
  become: yes
  tasks: 
  - name: enable nodejs 20
    command: dnf module enable nodejs:20 -y 
  - name: install nodejs 20
    package:
      name: nodejs
      state: present
  - name: create roboshop system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System user"
  - name: remove app directory
    file:
      path: /app
      state: absent
  - name: delete catalogue.zip in tmp directory
    file:
      path: /tmp/catalogue.zip
      state: absent
  - name: create app directory
    file:
      path: /app
      state: directory
  - name: dowload catalogue
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip
  - name: unzip catalogue
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes # The archive is already on the target host. Ansible skips the copy step and extracts it in place.
# "remote_src: no" The archive is on the control node (the machine running Ansible). Ansible copies it to the target host first, then extracts it.
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: copy catalogue service
    template: 
# copy transfers a file exactly as it is. 
# Template first processes the file through Jinja2, filling in variables, conditions, and loops, and then transfers the result.
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
  - name: copy mongodb repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mong.repo
  - name: install mongodb client
    package:
      name: mongodb-mongosh 
      state: present
  - name: check catalogue schema exist or not
    shell: mongosh --host "{{ MONGODB_HOST }}" --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output
    tags: # tags are used to run only specific tasks when we run the playbook
    - mongodb # to run only specfic tasks excluding above ones
  - name: print catalogue output 
    debug:
      msg: "{{ catalogue_output }}"
    tags:
    - mongodb # you must -t mongodb in command line 
  - name: load products
    shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout | int < 0 # Here the output of stdout is a string as so we are converting the string to a integer with int 
    tags:
    - mongodb
  - name: daemon reload
    systemd_service:
      name: catalogue
      daemon_reload: true
  - name: enable and start catalogue
    service:
      name: catalogue
      state: restarted
      enabled: yes

# ansible-playbook 05-catalogue.yaml -t mongodb - Runs only the tasks with mongodb 
# ansible-playbook 05-catalogue.yaml 
